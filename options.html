<!DOCTYPE html>
<html>

<head>
  <title>Summarizer Settings</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>Summarizer Settings</h1>
      <div class="subtitle">Configure your AI providers and preferences</div>
    </header>

    <form id="settings-form">
      <!-- Provider Selection -->
      <div class="section">
        <div class="section-header">
          <h2>
            <svg class="section-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            AI Provider
          </h2>
        </div>

        <div class="provider-grid">
          <div class="provider-card">
            <input type="radio" name="provider" value="ollama" id="p_ollama">
            <label class="card-content" for="p_ollama">
              <strong>Ollama</strong>
              <span class="badge free">Local / Free</span>
            </label>
          </div>
          <div class="provider-card">
            <input type="radio" name="provider" value="groq" id="p_groq">
            <label class="card-content" for="p_groq">
              <strong>Groq Cloud</strong>
              <span class="badge free">Super Fast / Free Tier</span>
            </label>
          </div>
          <div class="provider-card">
            <input type="radio" name="provider" value="gemini" id="p_gemini">
            <label class="card-content" for="p_gemini">
              <strong>Google Gemini</strong>
              <span class="badge free">Robust Free Tier</span>
            </label>
          </div>
          <div class="provider-card">
            <input type="radio" name="provider" value="openai" id="p_openai">
            <label class="card-content" for="p_openai">
              <strong>OpenAI</strong>
              <span class="badge paid">Paid</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Configuration Sections -->

      <!-- Ollama Config -->
      <div class="section config-section" id="conf-ollama">
        <div class="section-header">
          <h2>Ollama Configuration</h2>
        </div>
        <div class="form-group">
          <label>Endpoint URL</label>
          <input type="text" id="ollamaUrl" placeholder="http://localhost:11434">
        </div>
        <div class="form-group">
          <label>Model Name</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="ollamaModel" list="ollama_models" placeholder="llama3">
            <button type="button" id="check-ollama-btn" class="btn btn-secondary"
              style="width: auto; white-space: nowrap;">Check Models</button>
          </div>
          <span class="help-text" id="ollama-status">Make sure you have run `ollama pull [model]`</span>
          <datalist id="ollama_models">
            <option value="llama3:latest">Llama 3</option>
            <option value="mistral:latest">Mistral</option>
          </datalist>
        </div>
      </div>

      <!-- Groq Config -->
      <div class="section config-section" id="conf-groq">
        <div class="section-header">
          <h2>Groq Configuration</h2>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="groqKey" placeholder="gsk_...">
          <span class="help-text">Get a free key at <a href="https://console.groq.com/keys"
              target="_blank">console.groq.com</a></span>
        </div>
        <div class="form-group">
          <label>Model</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="groqModel" list="groq_models" placeholder="llama3-8b-8192">
            <button type="button" id="check-groq-btn" class="btn btn-secondary"
              style="width: auto; white-space: nowrap;">Check Models</button>
          </div>
          <span class="help-text" id="groq-status"></span>
          <datalist id="groq_models">
            <option value="llama3-8b-8192">Llama 3 8B</option>
            <option value="llama3-70b-8192">Llama 3 70B</option>
            <option value="mixtral-8x7b-32768">Mixtral 8x7b</option>
            <option value="gemma-7b-it">Gemma 7B</option>
          </datalist>
        </div>
      </div>

      <!-- Gemini Config -->
      <div class="section config-section" id="conf-gemini">
        <div class="section-header">
          <h2>Gemini Configuration</h2>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="geminiKey" placeholder="AIza...">
          <span class="help-text">Get a free key at <a href="https://aistudio.google.com/app/apikey"
              target="_blank">aistudio.google.com</a></span>
        </div>
        <div class="form-group">
          <label>Model</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="geminiModel" list="gemini_models" placeholder="gemini-1.5-flash">
            <button type="button" id="check-gemini-btn" class="btn btn-secondary"
              style="width: auto; white-space: nowrap;">Check Models</button>
          </div>
          <span class="help-text" id="gemini-status"></span>
          <datalist id="gemini_models">
            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
            <option value="gemini-1.0-pro">Gemini 1.0 Pro</option>
          </datalist>
        </div>
      </div>

      <!-- OpenAI Config -->
      <div class="section config-section" id="conf-openai">
        <div class="section-header">
          <h2>OpenAI Configuration</h2>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="openaiKey" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label>Model</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="openaiModel" list="openai_models" placeholder="gpt-4o-mini">
            <button type="button" id="check-openai-btn" class="btn btn-secondary"
              style="width: auto; white-space: nowrap;">Check Models</button>
          </div>
          <span class="help-text" id="openai-status"></span>
          <datalist id="openai_models">
            <option value="gpt-4o-mini">GPT-4o Mini</option>
            <option value="gpt-4-turbo">GPT-4 Turbo</option>
            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
          </datalist>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="save">Save Settings</button>

      <div id="status" class="status-msg"></div>
    </form>
  </div>
  <script src="options.js"></script>
</body>

</html>
